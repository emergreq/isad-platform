services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: isad
      POSTGRES_PASSWORD: isad
      POSTGRES_DB: isad
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isad"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    image: isad-platform-app
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://isad:isad@db:5432/isad
      APP_ORIGIN: http://localhost:5173
      ASSISTANT_DATABASE_URL: postgres://isad_assistant:${ASSISTANT_DB_PASSWORD:?Run scripts/init-local-secrets.js first}@db:5432/isad_assistant
      ASSISTANT_SHARED_SECRET: ${ASSISTANT_SHARED_SECRET:?Run scripts/init-local-secrets.js first}
      ASSISTANT_URL: http://assistant:3001
    ports: ["127.0.0.1:3000:3000", "127.0.0.1:5173:5173"]
    depends_on:
      db: { condition: service_healthy }
    command: sh server/start.sh
    volumes:
      - .:/app
      - /app/node_modules
  assistant:
    image: isad-platform-app
    restart: on-failure
    env_file:
      - path: .env
        required: false
    environment:
      ASSISTANT_DATABASE_URL: postgres://isad_assistant:${ASSISTANT_DB_PASSWORD:?Run scripts/init-local-secrets.js first}@db:5432/isad_assistant
      ASSISTANT_SHARED_SECRET: ${ASSISTANT_SHARED_SECRET:?Run scripts/init-local-secrets.js first}
    command: node assistant/server.js
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - .:/app
      - /app/node_modules
volumes:
  pgdata:

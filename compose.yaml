services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: isad
      POSTGRES_PASSWORD: isad
      POSTGRES_DB: isad
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isad"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgres://isad:isad@db:5432/isad
      APP_ORIGIN: http://localhost:5173
    ports: ["127.0.0.1:3000:3000", "127.0.0.1:5173:5173"]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "npm run migrate && npm start & npm run dev"
volumes:
  pgdata:
